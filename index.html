<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuan Gonzalez — Data Analyst & BI Specialist</title>
<meta name="description" content="Yuan Gonzalez — Data Analyst and BI Specialist focused on Power BI, SQL, Python, DAX and data-driven decision making.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f7f9fc;
  --white: #ffffff;
  --text: #101828;
  --muted: #667085;
  --blue: #1769ff;
  --blue-dark: #0f5bd8;
  --green: #23b26d;
  --line: rgba(16,24,40,.08);
  --shadow: 0 24px 70px rgba(16,24,40,.08);
  --shadow-hover: 0 30px 80px rgba(16,24,40,.13);
  --max: 1180px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display",
               "SF Pro Text", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

.container {
  width: min(var(--max), calc(100% - 48px));
  margin: 0 auto;
}

/* NAVIGATION */

nav {
  position: fixed;
  inset: 0 0 auto 0;
  height: 72px;
  z-index: 1000;
  background: rgba(255,255,255,.84);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid rgba(16,24,40,.06);
}

.nav-inner {
  width: min(var(--max), calc(100% - 48px));
  height: 100%;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.7px;
}

.logo span { color: var(--blue); }

.nav-links {
  display: flex;
  align-items: center;
  gap: 34px;
  list-style: none;
}

.nav-links a {
  color: #344054;
  font-size: 13px;
  font-weight: 500;
  transition: .2s ease;
}

.nav-links a:hover { color: var(--blue); }

.nav-contact {
  color: #fff !important;
  background: var(--blue);
  padding: 11px 21px;
  border-radius: 999px;
  font-weight: 600 !important;
  box-shadow: 0 8px 20px rgba(23,105,255,.18);
}

.nav-contact:hover {
  background: var(--blue-dark) !important;
  transform: translateY(-1px);
}

/* HERO */

.hero {
  min-height: 690px;
  padding: 125px 0 70px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 78% 34%, rgba(81,166,255,.18), transparent 27%),
    radial-gradient(circle at 72% 75%, rgba(77,211,145,.14), transparent 24%),
    linear-gradient(180deg, #ffffff 0%, #f7f9fc 100%);
}

.hero::before {
  content: "";
  position: absolute;
  width: 520px;
  height: 520px;
  right: -190px;
  top: 30px;
  border-radius: 50%;
  background: rgba(90,200,250,.10);
  filter: blur(70px);
  pointer-events: none;
}

.hero-grid {
  width: min(var(--max), calc(100% - 48px));
  margin: auto;
  min-height: 510px;
  display: grid;
  grid-template-columns: 1.02fr .98fr;
  align-items: center;
  gap: 55px;
  position: relative;
  z-index: 1;
}

.hero-copy {
  text-align: left;
  position: relative;
  z-index: 3;
}

.availability {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  margin-bottom: 34px;
  border: 1px solid rgba(35,178,109,.12);
  border-radius: 999px;
  background: rgba(226,250,238,.82);
  color: #16834e;
  font-size: 11px;
  font-weight: 600;
}

.availability-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.hero-intro {
  color: #475467;
  font-size: 16px;
  margin-bottom: 10px;
}

.hero h1 {
  font-size: clamp(52px, 6.4vw, 82px);
  line-height: .98;
  letter-spacing: -4.8px;
  font-weight: 800;
  white-space: nowrap;
}

.hero-role {
  margin-top: 16px;
  font-size: clamp(23px, 2.6vw, 36px);
  line-height: 1.15;
  letter-spacing: -1.5px;
  font-weight: 750;
  background: linear-gradient(90deg, #1769ff 0%, #1f91e8 52%, #2dbb72 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-description {
  max-width: 590px;
  margin-top: 24px;
  color: #667085;
  font-size: 16px;
  line-height: 1.7;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 30px;
}

.btn {
  min-height: 48px;
  padding: 0 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 650;
  transition: .25s ease;
}

.btn-primary {
  background: var(--blue);
  color: white;
  box-shadow: 0 10px 25px rgba(23,105,255,.22);
}

.btn-primary:hover {
  background: var(--blue-dark);
  transform: translateY(-2px);
  box-shadow: 0 15px 30px rgba(23,105,255,.28);
}

.btn-secondary {
  background: rgba(255,255,255,.9);
  color: #1d2939;
  border: 1px solid rgba(16,24,40,.09);
  box-shadow: 0 5px 18px rgba(16,24,40,.05);
}

.btn-secondary:hover {
  background: white;
  transform: translateY(-2px);
}

/* PORTRAIT */

.hero-visual {
  min-height: 510px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-visual::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.92), rgba(228,239,255,.72) 48%, rgba(213,246,230,.28) 75%, transparent 76%);
  filter: blur(1px);
}

.hero-visual::after {
  content: "";
  position: absolute;
  width: 430px;
  height: 430px;
  right: 4%;
  top: 6%;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(23,105,255,.10) 1px, transparent 1.5px);
  background-size: 13px 13px;
  opacity: .45;
  mask-image: radial-gradient(circle, black 15%, transparent 70%);
  -webkit-mask-image: radial-gradient(circle, black 15%, transparent 70%);
}

.portrait-wrap {
  width: 430px;
  height: 430px;
  border-radius: 50%;
  padding: 8px;
  background: rgba(255,255,255,.96);
  border: 1px solid rgba(16,24,40,.10);
  box-shadow:
    0 22px 55px rgba(16,24,40,.12),
    0 0 0 8px rgba(255,255,255,.42);
  position: relative;
  z-index: 2;
}

.portrait {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 31%;
  border-radius: 50%;
  display: block;
}

/* STATS */

.value-strip {
  position: relative;
  z-index: 5;
  margin-top: -8px;
}

.value-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(16,24,40,.06);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.value {
  min-height: 120px;
  padding: 25px 28px;
  display: flex;
  align-items: center;
  gap: 18px;
  border-right: 1px solid rgba(16,24,40,.07);
}

.value:last-child { border-right: 0; }

.value-icon {
  width: 48px;
  height: 48px;
  flex: 0 0 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 21px;
  background: #edf4ff;
  color: var(--blue);
}

.value:nth-child(2) .value-icon {
  background: #eaf9f0;
  color: #1fa866;
}

.value:nth-child(3) .value-icon {
  background: #f2efff;
  color: #635bdb;
}

.value:nth-child(4) .value-icon {
  background: #fff4e9;
  color: #f07b24;
}

.value strong {
  display: block;
  font-size: 19px;
  letter-spacing: -.5px;
}

.value span {
  display: block;
  color: #667085;
  font-size: 11px;
  margin-top: 4px;
}

/* SECTIONS */

section { padding: 115px 0; }

.section-kicker {
  color: var(--blue);
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  margin-bottom: 13px;
}

.section-title {
  font-size: clamp(38px, 5vw, 60px);
  line-height: 1.02;
  letter-spacing: -3.5px;
  font-weight: 800;
}

.section-sub {
  max-width: 650px;
  margin-top: 19px;
  color: #667085;
  font-size: 16px;
  line-height: 1.65;
}

/* PROJECTS */

.project-stack {
  margin-top: 52px;
  display: grid;
  gap: 28px;
}

.project-card {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  background: white;
  border: 1px solid rgba(16,24,40,.07);
  box-shadow: var(--shadow);
  transition: .35s ease;
}

.project-card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-hover);
}

.project-card::before {
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 4px;
  background: #ffffff;
}

.project-top {
  padding: 48px 52px 35px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 30px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
